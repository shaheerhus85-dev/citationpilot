<svg viewBox="0 0 320 90" fill="none" xmlns="http://www.w3.org/2000/svg" id="cp-logo-dark-svg">
  <defs>
    <linearGradient id="cp-grad-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#4f46e5" />
      <stop offset="100%" stopColor="#818cf8" />
    </linearGradient>
    <filter id="cp-glow-d" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" floodColor="#38bdf8" floodOpacity="0.4" />
    </filter>
  </defs>

  {/* Compass Outer Ring */}
  <circle cx="45" cy="45" r="28" stroke="url(#cp-grad-d)" strokeWidth="3.5" opacity="0.95" />

  {/* Directional points */}
  <polygon points="45,11 42,16 48,16" fill="url(#cp-grad-d)" />
  <polygon points="45,79 42,74 48,74" fill="url(#cp-grad-d)" />
  <polygon points="79,45 74,42 74,48" fill="url(#cp-grad-d)" />
  <polygon points="11,45 16,42 16,48" fill="url(#cp-grad-d)" />

  {/* Location Pin */}
  <path d="M45,25 C37.5,25 32.5,30 32.5,37.5 C32.5,47.5 45,60 45,60 C45,60 57.5,47.5 57.5,37.5 C57.5,30 52.5,25 45,25 Z" fill="url(#cp-grad-d)" filter="url(#cp-glow-d)" />
  <circle cx="45" cy="36" r="4" fill="#0c0c0e" />

  {/* Automation/Route Line */}
  <path d="M19,56 Q47,43 71,56" fill="none" stroke="url(#cp-grad-d)" strokeWidth="2.5" strokeLinecap="round" />
  <circle cx="31" cy="50.5" r="4" fill="#38bdf8" stroke="#0c0c0e" strokeWidth="1.5" />
  <circle cx="61" cy="51.5" r="4" fill="#818cf8" stroke="#0c0c0e" strokeWidth="1.5" />

  {/* Wordmark (Dark Mode: White / Electric Blue) */}
  <text x="88" y="44" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="-0.03em">Citation<tspan dx="8" fill="url(#cp-grad-d)">Pilot</tspan></text>
  <text x="89" y="58" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="9" fill="#0ea5e9" letter-spacing="0.22em">SEO AUTOMATION</text>
</svg>
